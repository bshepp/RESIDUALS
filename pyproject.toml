[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "residuals"
version = "0.1.0"
description = "Multi-method differential feature detection in Digital Elevation Models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "bshepp" }]
keywords = ["DEM", "LiDAR", "feature-detection", "signal-decomposition", "archaeology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-image>=0.19.0",
    "opencv-python-headless>=4.5.0",
    "PyWavelets>=1.1.0",
    "scikit-learn>=1.0.0",
    "tqdm>=4.62.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
geo = [
    "rasterio>=1.3.0",
    "geopandas>=0.12.0",
    "shapely>=2.0.0",
    "pyproj>=3.4.0",
    "laspy>=2.0.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]
all = ["residuals[geo,dev]"]

[project.urls]
Repository = "https://github.com/bshepp/RESIDUALS"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/archive/*" = ["E501"]
